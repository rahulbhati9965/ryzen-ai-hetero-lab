apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryzen-ai-inference-deployment
  labels:
    app: ryzen-ai-infer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ryzen-ai-infer
  template:
    metadata:
      labels:
        app: ryzen-ai-infer
    spec:
      containers:
      - name: inference-container
        image: ryzen-ai-hetero-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ryzen-ai-inference-service
spec:
  type: NodePort
  selector:
    app: ryzen-ai-infer
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
